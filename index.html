<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星光圣域 Starlight Sacred Sanctuary</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script defer src="assets/js/background.js"></script>

    <script defer src="assets/js/main.js"></script>
    <script defer src="assets/js/seamless.js"></script>

    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a, .enter-btn" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a, .enter-btn" }, "eagerness": "conservative" }
            ]
        }
    </script>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">

        <div class="logo">
            星光圣域
        </div>

        <nav>
            <a href=".">首页</a>
            <a href="starmap/">星图</a>
            <a href="fleet/">舰队</a>
            <a href="tool/">工具</a>
            <a href="archive/">档案</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="sub">
                    星光圣域
                    <br><br>
                    STARLIGHT SACRED SANCTUARY
                </p>

                <h1 id="typing"></h1>

                <p class="desc">
                    Astra vias nostras illustrent pietate.
                </p>

                <!-- 用真链接代替 button：可被预渲染/预取命中，也支持中键、新标签打开 -->
                <a class="enter-btn" href="main/mainpage.html">ENTER</a>

            </div>

        </section>

    </main>

</body>
</html>
