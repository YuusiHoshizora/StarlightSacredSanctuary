<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舰队·星光圣域</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/fleet/index.css">
    <script defer src="../assets/js/background.js"></script>
    <script defer src="../assets/js/seamless.js"></script>

    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">

        <div class="logo">
            星光圣域
        </div>

        <nav>
            <a href="..">首页</a>
            <a href="../starmap/">星图</a>
            <a href=".">舰队</a>
            <a href="../tool/">工具</a>
            <a href="../archive/">档案</a>
        </nav>

    </header>

    <main>
        <section class="fleet-section">
            <div class="fleet-grid">

                <a href="#" class="fleet-card fleet-card--research">
                    <h2>科研与管理舰队</h2>
                    <p class="english">Research & Administration Fleet</p>
                    <p class="desc">科研与管理舰队是星光圣域人口最为密集的舰队，负责星光圣域绝大部分的科研任务。</p>
                </a>

                <a href="#" class="fleet-card fleet-card--industry">
                    <h2>工业与收集舰队</h2>
                    <p class="english">Industry & Collection Fleet</p>
                    <p class="desc">工业与收集舰队是星光圣域对外交流的主要舰队，负责几乎所有物资的收集和制造。</p>
                </a>

                <a href="#" class="fleet-card fleet-card--defense">
                    <h2>主防御舰队</h2>
                    <p class="english">Primary Defense Fleet</p>
                    <p class="desc">主防御舰队是星光圣域的军事舰队，负责所有的军事行动。</p>
                </a>

            </div>
        </section>
    </main>

</body>

</html>
