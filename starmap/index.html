<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星图·星光圣域</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/starmap/index.css">
    <!-- 星图页专用背景参数：必须排在 background.js 之前 -->
    <script defer src="../assets/js/starmap-bg.js"></script>
    <script defer src="../assets/js/background.js"></script>

    <script defer src="../assets/js/starmap-data.js"></script>
    <script defer src="../assets/js/starmap.js"></script>
    <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      console.log('SW registered: ', reg.scope);
    }).catch((err) => {
      console.log('SW registration failed: ', err);
    });
  });
}
</script>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">

        <div class="logo">
            星光圣域
        </div>

        <nav>
            <a href="..">首页</a>
            <a href=".">星图</a>
            <a href="../fleet/">舰队</a>
            <a href="../tool/">工具</a>
            <a href="../archive/">档案</a>
        </nav>

    </header>

    <main>

        <div class="starmap-layout">

            <!-- 左侧：星图 -->
            <div class="starmap-left">
                <canvas id="starmap-canvas"></canvas>

                <!-- 比例尺控制：放大 / 缩小 / 回到默认 -->
                <div class="map-zoom" role="group" aria-label="比例尺控制">
                    <button type="button" id="zoom-in" class="map-zoom__btn" aria-label="放大" title="放大">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button type="button" id="zoom-out" class="map-zoom__btn" aria-label="缩小" title="缩小">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
                    </button>
                    <button type="button" id="zoom-reset" class="map-zoom__btn" aria-label="回到默认" title="回到默认">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="7.5"/>
                            <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 右侧：星系介绍 -->
            <aside class="starmap-right">

                <div id="system-info"></div>
                <div id="system-list" class="system-list"></div>

            </aside>

        </div>

    </main>
</body>
</html>
