<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页面 · 星光圣域</title>

    <!-- 站点图标：SVG，跟随浏览器主题切换黑/白描边 -->
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo_SSS.svg">

    <!-- 加载屏：只有「资源还没进缓存」时才显示（首次访问 / 缓存被清掉）。
         判断必须在这里同步做 —— 首次绘制前就要决定，否则会先画出页面再盖上、闪一下。
         结构与逻辑见 assets/js/boot.js，样式见 assets/css/boot.css。 -->
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;      // 没有 SW，就没有"缓存全部资源"这回事
            if (location.protocol === 'file:') return;        // 本地双击打开时 SW 注册不了，别把页面卡住
            /* 这一趟要不要显示加载屏。必须同步、首次绘制前决定，否则会先画出页面再盖上、闪一下。 */
            function decide() {
                var force = /(^|[?&])boot(=|&|$)/.test(location.search || '');   // ?boot=1：强制重播（调试用）
                var booted = false;
                try { booted = localStorage.getItem('sss-booted') === '1'; } catch (e) {}

                // ① 这一次不是从 SW 缓存里拿的 → 该弹加载屏。controller 为空意味着：首次访问、
                //    Ctrl+F5 硬刷新（硬刷新会连 Service Worker 一起绕过）、或站点数据被清过。
                //    光看 sss-booted 标记不够 —— 它只记「这台浏览器走过加载流程」，
                //    硬刷新时「标记还在」与「资源确实没走缓存」会分叉。
                var cold = !navigator.serviceWorker.controller;

                // ② 刚部署过新版本：seamless.js 在新 SW 接管（controllerchange）时留下的标记，
                //    说明缓存整个换过一轮，这一趟补弹一次。读走即清，只补一次。
                var afterUpdate = false;
                try {
                    afterUpdate = localStorage.getItem('sss-boot-next') === '1';
                    if (afterUpdate) localStorage.removeItem('sss-boot-next');
                } catch (e) {}

                // ③ 其余情况（站内正常导航）：不弹，切换才不会闪
                if (force || !booted || cold || afterUpdate) {
                    document.documentElement.className += ' sss-boot';
                }
            }

            // 预渲染中的文档是隐藏的：这时候不该判定（controller 状态、标记消费都不该在隐藏期
            // 决定），更不该让加载屏放掉 —— boot.js 会在后台把门开完，用户激活后根本看不到。
            // 所以等真正被激活（首次绘制就在这一刻）再同步判一次，仍然不会闪。
            // 若用户最后点的是别的链接、这份预渲染被丢弃，sss-boot-next 也没被吃掉，下一页照常补弹。
            if (document.prerendering) {
                document.addEventListener('prerenderingchange', decide, { once: true });
            } else {
                decide();
            }

            // 站内跳转进来的（referrer 与本页同源）：先把内容藏起来，等字体就绪再淡入。
            // 背景画布与导航栏全站一致，所以只让内容参与过渡 —— 看起来就是
            // 「外壳常驻、内容替换」，顺带把字体解码那 0.3–0.7 秒的空窗盖住。
            // 必须在这里同步决定（首次绘制前），否则会先把内容画出来再藏、闪一下。
            var fromSite = false;
            try {
                fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (e) {}
            if (fromSite) {
                document.documentElement.classList.add('sss-switch');
                // 兜底：万一 boot.js 没跑起来，5 秒后也得把内容放出来
                window.setTimeout(function () {
                    document.documentElement.classList.remove('sss-switch');
                    document.documentElement.classList.add('sss-switch-in');
                }, 5000);
            }
        })();
    </script>
    <!-- 首帧保护：预渲染被提前激活时（悬停后就点），浏览器可能先画一帧"样式表还在路上"的
         裸 HTML（正常导航不会 —— 样式表本身阻塞渲染）。这里在解析阶段先把内容藏起来，
         等样式表就位（或 2s 兜底）再放行；禁用 JS 时不加 js 类，等于没这段。 -->
    <style>
        /* 底色只能挂在"加载中"这个状态下：html 一旦有背景，body 的黑色就不再传播到画布，
           负 z-index 的背景层（.hex-bg 等）会被 body 盖住 —— 背景就没了。
           所以两条都限定在 js 且未 css-ready 时，样式一到就撤销、传播恢复。 */
        html.js:not(.css-ready) { background: black; }
        html.js:not(.css-ready) body { visibility: hidden; }
    </style>
    <script>
        (function () {
            var h = document.documentElement;
            h.classList.add('js');
            window.setTimeout(function () { h.classList.add('css-ready'); }, 2000);
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/boot.css">
    <script defer src="../assets/js/boot.js"></script>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/main/mainpage.css">
    <script defer src="../assets/js/background.js"></script>
    <script defer src="../assets/js/cursor.js"></script>
    <script defer src="../assets/js/notice.js"></script>

    <!-- marked.js 用于 Markdown 渲染 -->
    <script src="../assets/js/marked.min.js"></script>
    <script defer src="../assets/js/seamless.js"></script>
    <script defer src="../assets/js/spa.js"></script>
    <script defer src="../assets/js/navtoggle.js"></script>
    <!-- 彩蛋登记册：记录 <body data-egg> 的彩蛋、给「关于」页那张卡片填内容。
         ⚠️ 外壳脚本，站内换页（spa.js）不会重跑它 —— 每页都必须引，否则经由同文档换页
         进「关于」页 / 进彩蛋页时，登记与卡片都不会发生。 -->
    <script defer src="../assets/js/eggs.js"></script>
    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
    <!-- 样式表就位后放行（这行内联脚本会被它前面的样式表阻塞，所以执行时样式一定已经应用） -->
    <script>document.documentElement.classList.add('css-ready');</script>
</head>

<script>
(function() {

    // ===== Markdown 渲染配置 =====
    marked.setOptions({
        breaks: true,        // 单换行视为 <br>
        gfm: true,           // GitHub Flavored Markdown
    });

    // ===== 视图切换 =====
    const listView    = document.getElementById('blog-list-view');
    const articleView = document.getElementById('article-view');
    const articleContent = document.getElementById('article-content');
    const backBtn     = document.getElementById('back-btn');
    const centerView  = document.querySelector('.center-panel');

    /* 两段时长：文字先淡出，再让卡片背景展开 / 收回，最后文字淡入 */
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var FADE_MS  = reduceMotion ? 0 : 180;
    var MORPH_MS = reduceMotion ? 0 : 380;

    var articleGen = 0;          // 快速打开 / 返回时作废旧 fetch / 旧定时器
    var morphTimer = 0;
    var morphCard = null;

    function centerContentRect() {
        var cs = window.getComputedStyle(centerView);
        var padL = parseFloat(cs.paddingLeft) || 0;
        var padR = parseFloat(cs.paddingRight) || 0;
        var padT = parseFloat(cs.paddingTop) || 0;
        var padB = parseFloat(cs.paddingBottom) || 0;
        return {
            left: padL,
            top: padT,
            width: centerView.clientWidth - padL - padR,
            height: centerView.clientHeight - padT - padB
        };
    }

    function rectOfCard(card) {
        var c = centerView.getBoundingClientRect();
        var r = card.getBoundingClientRect();
        return {
            left: r.left - c.left,
            top: r.top - c.top,
            width: r.width,
            height: r.height
        };
    }

    function setPanelRect(rect) {
        articleView.style.left = rect.left + 'px';
        articleView.style.top = rect.top + 'px';
        articleView.style.width = rect.width + 'px';
        articleView.style.height = rect.height + 'px';
    }

    /* 打开：中栏文字先淡出 → 点击卡的背景向上/向下展开成文章面板 → 文章文字淡入 */
    function startMorph(card, gen) {
        var initial = rectOfCard(card);
        var finalRect = centerContentRect();

        window.clearTimeout(morphTimer);
        morphCard = card;

        articleView.classList.remove('active', 'leaving', 'is-closing');
        articleView.classList.add('is-visible');
        articleView.classList.remove('is-content-visible');

        listView.classList.remove('hidden');
        listView.classList.add('is-morphing');
        document.querySelectorAll('.blog-card.is-morph-source').forEach(function (c) {
            c.classList.remove('is-morph-source');
        });
        card.classList.add('is-morph-source');

        articleView.style.transition = 'none';
        setPanelRect(initial);
        articleContent.scrollTop = 0;
        void articleView.offsetWidth;
        articleView.style.transition = '';

        morphTimer = window.setTimeout(function () {
            if (gen !== articleGen || !articleView.classList.contains('is-visible')) return;
            setPanelRect(finalRect);

            morphTimer = window.setTimeout(function () {
                if (gen !== articleGen || !articleView.classList.contains('is-visible')) return;
                articleView.classList.add('is-content-visible');
                listView.classList.add('hidden');
            }, MORPH_MS);
        }, FADE_MS);
    }

    /* 关闭：文章文字先淡出 → 面板缩回点击卡片的尺寸 → 列表文字 / 其它卡片淡入 */
    function closeArticle() {
        if (!articleView.classList.contains('is-visible')) return;
        if (articleView.classList.contains('is-closing')) return;

        var gen = ++articleGen;
        window.clearTimeout(morphTimer);
        articleView.classList.remove('is-content-visible');
        articleView.classList.add('is-closing');

        morphTimer = window.setTimeout(function () {
            if (gen !== articleGen || !articleView.classList.contains('is-visible')) return;

            listView.classList.remove('hidden');
            listView.classList.add('is-morphing');
            if (morphCard) morphCard.classList.add('is-morph-source');

            var target = morphCard ? rectOfCard(morphCard) : null;
            if (target) setPanelRect(target);

            morphTimer = window.setTimeout(function () {
                if (gen !== articleGen) return;
                articleView.classList.remove('is-visible', 'is-closing');
                articleView.style.transition = 'none';
                listView.classList.remove('is-morphing');
                if (morphCard) morphCard.classList.remove('is-morph-source');
                morphCard = null;
                articleContent.innerHTML = '';
                articleView.style.transition = '';
            }, MORPH_MS);
        }, FADE_MS);
    }

    /**
     * 展示文章视图
     * @param {string} mdContent - Markdown 字符串
     * @param {string} title     - 文章标题
     * @param {string} date      - 发布日期
     * @param {string} tag       - 分类标签
     */
    function renderArticle(mdContent, title, date, tag) {
        // 移除第一行的标签和第二行的日期（避免渲染到正文）
        var lines = mdContent.split(/\r?\n/);
        var tagIdx = -1, dateIdx = -1;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (tagIdx === -1 && line.startsWith('#') && !line.startsWith('##')) {
                tagIdx = i;
            } else if (tagIdx !== -1 && dateIdx === -1 && line && !line.startsWith('---')) {
                dateIdx = i;
                break;
            }
        }
        // 从后往前删除，避免索引变化
        if (dateIdx > tagIdx) {
            lines.splice(dateIdx, 1);
            lines.splice(tagIdx, 1);
        } else if (tagIdx !== -1) {
            lines.splice(tagIdx, 1);
        }
        mdContent = lines.join('\n');

        // 树形结构靠行首缩进表达层级，Markdown 默认会把续行的缩进吃掉，这里补回来
        mdContent = preserveLineIndent(mdContent);

        // 渲染文章头部 + Markdown 内容
        articleContent.innerHTML =
            '<div class="article-header">' +
                '<h1>' + escapeHtml(title) + '</h1>' +
                '<div class="article-meta">' +
                    '<span>' + escapeHtml(date) + '</span>' +
                    '<span>·</span>' +
                    '<span>' + escapeHtml(tag) + '</span>' +
                '</div>' +
            '</div>' +
            '<div class="markdown-body">' + marked.parse(mdContent) + '</div>';

        // 让所有 Markdown 渲染出的链接在新标签页打开
        articleContent.querySelectorAll('.markdown-body a').forEach(function(link) {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        });

        articleContent.scrollTop = 0;
    }

    backBtn.addEventListener('click', closeArticle);

// ===== 左侧分类过滤 =====
document.querySelector('.vertical-nav').addEventListener('click', function(e) {
    const link = e.target.closest('a[data-filter]');
    if (!link) return;
    e.preventDefault();

    // 移除所有分类链接的选中状态，再点亮当前这一条（含「全部」）
    this.querySelectorAll('a[data-filter]').forEach(function(a) {
        a.classList.remove('active');
    });
    link.classList.add('active');

    const filter = link.dataset.filter;

    // 还在文章视图里点分类：先让它缩回卡片，等收回后再套用筛选
    if (articleView.classList.contains('is-visible')) {
        closeArticle();
        window.setTimeout(function () { applyFilter(filter); }, FADE_MS + MORPH_MS + 80);
    } else {
        applyFilter(filter);
    }
});

    // ===== 分类筛选：整列卡片向左离开，新的一列从左边进来 =====
    function applyFilter(filter) {        var list = document.getElementById('blog-list');
        if (!list) return;

        function apply() {
            document.querySelectorAll('.blog-card').forEach(function (card) {
                card.style.display = (filter === 'all' || card.dataset.tag === filter) ? '' : 'none';
            });
        }

        // 列表当前不可见（还在文章视图里）或正在切换：直接改显示，不播动画
        if (listView.classList.contains('hidden') || list.classList.contains('switching')) {
            apply();
            return;
        }

        list.classList.add('switching');                 // 向左离开
        window.setTimeout(function () {
            apply();
            list.classList.remove('switching');
            void list.offsetWidth;                       // 强制回流，进入动画才会重新播放
            list.classList.add('entering');              // 从左边进来
            window.setTimeout(function () { list.classList.remove('entering'); }, 420);
        }, 240);
    }

    // ===== 分类条目计数（左侧读数的字号 / 颜色与档案页名录一致） =====
    function updateCategoryCounts() {
        var cards = document.querySelectorAll('.blog-card');
        var counts = { all: cards.length };
        cards.forEach(function (card) {
            var tag = card.dataset.tag;
            if (tag) counts[tag] = (counts[tag] || 0) + 1;
        });
        document.querySelectorAll('.vertical-nav a[data-filter]').forEach(function (a) {
            var n = counts[a.dataset.filter] || 0;
            var s = a.querySelector('.vertical-nav__count');
            if (s) s.textContent = n ? String(n) : '';
        });
    }

    // ===== 安全转义辅助 =====
    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ===== 从 Markdown 第一行提取标签（格式：`#标签` 或 `# 标签`） =====
    function extractTag(mdText) {
        var lines = mdText.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.startsWith('#') && !line.startsWith('##')) {
                return line.replace(/^#\s*/, '').trim();
            }
        }
        return '';
    }

    // ===== 从 Markdown 第二行提取日期（标签行的下一行） =====
    function extractDate(mdText) {
        var lines = mdText.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.startsWith('#') && !line.startsWith('##')) {
                // 标签行，取它的下一行作为日期
                if (i + 1 < lines.length) {
                    return lines[i + 1].trim();
                }
                return '';
            }
                }
        return '';
    }

    // ===== 保留段落续行的行首缩进 =====
    // Markdown 会把段落「续行」行首的空白吃掉，而写日志的树形结构正是靠行首缩进表达层级的。
    // 这里把续行行首的制表符 / 空格换成等宽的不换行空格（U+00A0）：解析器不会再吃掉它，
    // 行内语法（**粗体**、链接等）照常生效。
    // 只在「上一行非空」（真正的段落续行）时转换，且不碰下面这些行首有结构含义的写法：
    //   · 围栏代码块（``` / ~~~，进出都不碰）
    //   · 列表、引用、标题、表格、分隔线
    function preserveLineIndent(mdText) {
        var lines = mdText.split(/\r?\n/);
        var out = [];
        var inFence = false;
        var STRUCT = /^(?:[-+*]\s|\d+[.)]\s|>|#|\||-{3,}$|\*{3,}$|_{3,}$)/;

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^\s*(?:```|~~~)/.test(line)) {
                inFence = !inFence;
                out.push(line);
                continue;
            }

            var prevBlank = out.length === 0 || out[out.length - 1].trim() === '';
            var m = inFence ? null : line.match(/^([ \t]+)(\S.*)$/);

            if (m && !prevBlank && !STRUCT.test(m[2])) {
                var width = 0;
                for (var k = 0; k < m[1].length; k++) {
                    width += m[1].charAt(k) === '\t' ? 4 : 1;   // 制表符按 4 个空格折算（与 CommonMark 一致）
                }
                out.push(new Array(width + 1).join('\u00A0') + m[2]);
            } else {
                out.push(line);
            }
        }
        return out.join('\n');
    }

    // ===== 日历渲染 =====
    const today = new Date();
    let displayYear  = today.getFullYear();
    let displayMonth = today.getMonth();

    const yearMonthEl = document.getElementById('cal-year-month');
    const gridEl      = document.getElementById('cal-grid');
    const prevBtn     = document.getElementById('cal-prev');
    const nextBtn     = document.getElementById('cal-next');

    const monthNames = ['01','02','03','04','05','06','07','08','09','10','11','12'];

    function renderCalendar(year, month) {
        const firstDay       = new Date(year, month, 1);
        const lastDay        = new Date(year, month + 1, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth    = lastDay.getDate();
        const prevMonthLastDay = new Date(year, month, 0).getDate();

        yearMonthEl.textContent = 'A.D. ' + year + '-' + monthNames[month];

        let html = '';
        const dayNames = ['Sun.','Mon.','Tues.','Wed.','Thur.','Fri.','Sat.'];
        for (let d = 0; d < 7; d++) {
            html += '<div class="day-name">' + dayNames[d] + '</div>';
        }
        for (let i = 0; i < startDayOfWeek; i++) {
            const date = prevMonthLastDay - startDayOfWeek + 1 + i;
            html += '<div class="day-cell other-month">' + date + '</div>';
        }
        for (let date = 1; date <= daysInMonth; date++) {
            const isToday = (year === today.getFullYear() && month === today.getMonth() && date === today.getDate());
            html += '<div class="day-cell' + (isToday ? ' today' : '') + '">' + date + '</div>';
        }
        const totalCells = startDayOfWeek + daysInMonth;
        const remaining  = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
            html += '<div class="day-cell other-month">' + i + '</div>';
        }
        gridEl.innerHTML = html;
    }

    prevBtn.addEventListener('click', function() {
        displayMonth--;
        if (displayMonth < 0) { displayMonth = 11; displayYear--; }
        renderCalendar(displayYear, displayMonth);
    });
    nextBtn.addEventListener('click', function() {
        displayMonth++;
        if (displayMonth > 11) { displayMonth = 0; displayYear++; }
        renderCalendar(displayYear, displayMonth);
    });

    renderCalendar(displayYear, displayMonth);

    // ===== 随机副标题 =====
    const subtitles = [
        "愿星光照亮我们的前程",
        "警告：无法连接至星域网或索拉克矩阵",
        "警告：无法连接至星光圣域主服务器",
        "警告：Astra未正常运行",
        "主页面加载完成",
        "事件列表加载完成",
    ];
    const subtitleEl = document.getElementById('subtitle-text');
    if (subtitleEl) {
        subtitleEl.textContent = subtitles[Math.floor(Math.random() * subtitles.length)];
    }

// ===== 动态生成所有博客卡片（从 index.json 自动读取文件列表） =====
(function () {
    var postDir = '../assets/post/';
    var listEl = document.getElementById('blog-list');
    if (!listEl) return;

    fetch(postDir + 'index.json')
        .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function (files) {
            files.forEach(function (filename) {
                var card = document.createElement('article');
                card.className = 'blog-card';
                card.setAttribute('data-md-src', postDir + filename);
                card.innerHTML =
                    '<div class="blog-title"></div>' +
                    '<div class="blog-meta">' +
                        '<span class="blog-date"></span>' +
                        '<span class="sep">·</span>' +
                        '<span class="blog-tag"></span>' +
                    '</div>' +
                    '<div class="blog-excerpt"></div>';

                // 填充文件名作为初始标题
                var titleEl = card.querySelector('.blog-title');
                if (titleEl) titleEl.textContent = filenameToTitle(postDir + filename);

                listEl.appendChild(card);
                updateCategoryCounts();

                // 异步填充摘要、标签、日期
                var excerptEl = card.querySelector('.blog-excerpt');
                var dateEl    = card.querySelector('.blog-date');
                var tagEl     = card.querySelector('.blog-tag');

                fetchMdCached(postDir + filename)
                    .then(function (text) {
                        if (excerptEl) excerptEl.textContent = extractExcerpt(text);
                        var tag = extractTag(text);
                        if (tag) {
                            card.dataset.tag = tag;
                            if (tagEl) tagEl.textContent = tag;
                        }
                        var date = extractDate(text);
                        if (date && dateEl) dateEl.textContent = date;
                        updateCategoryCounts();
                    })
                    .catch(function (err) {
                        console.warn('无法获取摘要:', filename, err);
                    });
            });
        })
        .catch(function (err) {
            listEl.innerHTML = '<div class="md-loading">无法加载文章列表（' + err.message + '）</div>';
        });
})();

    // ===== Markdown 内容缓存 & 从文章自动提取简介 =====
    var mdCache = {};

    function fetchMdCached(src) {
        if (!mdCache[src]) {
            mdCache[src] = fetch(src).then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            });
        }
        return mdCache[src];
    }

    function extractExcerpt(mdText) {
        var lines = mdText.split(/\r?\n/);
        var excerpt = '';
        var skipCount = 0;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || line.startsWith('---')) continue;
            skipCount++;
            if (skipCount <= 2) continue; // 跳过第1行（标签）和第2行（日期）
            excerpt = line.slice(0, 100);
            if (line.length > 100) excerpt += '…';
            break;
        }
        if (!excerpt) {
            excerpt = mdText.replace(/\s+/g, ' ').slice(0, 120);
            if (excerpt.length === 120) excerpt += '…';
        }
        return excerpt;
    }

    // 从 data-md-src 提取文件名（去掉路径和 .md 后缀）作为标题
    function filenameToTitle(src) {
        var name = src.replace(/\\/g, '/').split('/').pop(); // 取最后一段
        if (name.endsWith('.md')) name = name.slice(0, -3);
        return name;
    }

    // 页面加载后遍历所有有 data-md-src 的卡片，自动填充标题、标签、日期与简介
    document.querySelectorAll('.blog-card[data-md-src]').forEach(function(card) {
        var src = card.dataset.mdSrc;
        var titleEl = card.querySelector('.blog-title');
        var excerptEl = card.querySelector('.blog-excerpt');
        var dateEl = card.querySelector('.blog-date');
        var tagEl = card.querySelector('.blog-tag');

        if (src && titleEl) {
            titleEl.textContent = filenameToTitle(src);
        }
        if (src) {
            fetchMdCached(src).then(function(text) {
                // 更新简介
                if (excerptEl) {
                    excerptEl.textContent = extractExcerpt(text);
                }
                // 提取标签并更新卡片 data 属性与显示
                var tag = extractTag(text);
                if (tag) {
                    card.dataset.tag = tag;
                    if (tagEl) {
                        tagEl.textContent = tag;
                    }
                }
                // 提取日期并填充
                var date = extractDate(text);
                if (date && dateEl) {
                    dateEl.textContent = date;
                }
            }).catch(function(err) {
                console.warn('无法获取摘要:', src, err);
            });
        }
    });

    // 同时让卡片点击时也使用缓存 fetch，减少重复请求
    document.getElementById('blog-list').addEventListener('click', function(e) {
        var card = e.target.closest('.blog-card');
        if (!card) return;

        var title  = filenameToTitle(card.dataset.mdSrc) || '（无标题）';
        var date   = card.querySelector('.blog-date') ? card.querySelector('.blog-date').textContent : '';
        // 优先使用卡片的 data-tag（已被异步更新），其次硬编码，最后空字符串
        var tag    = card.dataset.tag    || '';
        var mdSrc  = card.dataset.mdSrc;
        var mdInline = card.dataset.mdInline || '';

        if (mdSrc) {
            var gen = ++articleGen;
            articleContent.innerHTML = '<div class="md-loading">正在加载……</div>';
            startMorph(card, gen);

            fetchMdCached(mdSrc)
                .then(function(text) {
                    if (gen !== articleGen || !articleView.classList.contains('is-visible')) return;
                    // 从缓存的文本中再次提取标签，确保与卡片一致
                    var fetchedTag = extractTag(text) || tag;
                    renderArticle(text, title, date, fetchedTag);
                })
                .catch(function(err) {
                    if (gen !== articleGen || !articleView.classList.contains('is-visible')) return;
                    if (mdInline) {
                        renderArticle(mdInline, title, date, tag);
                    } else {
                        articleContent.innerHTML =
                            '<div class="md-loading">无法加载文章内容（' + err.message + '）</div>';
                    }
                });
        } else if (mdInline) {
            articleContent.innerHTML = '';
            startMorph(card, ++articleGen);
            renderArticle(mdInline, title, date, tag);
        }
    });

})();
</script>
