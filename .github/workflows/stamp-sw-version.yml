name: Stamp SW Version

# 任何「页面内容」变动都会改写 sw.js 的 CACHE_VERSION，于是：
#   浏览器发现 sw.js 变了 → 安装新 SW（预缓存新资源）→ activate 换掉旧缓存
#   → controllerchange 让 seamless.js 写下 sss-boot-next
#   → 用户下次进入**任意页面**时补弹一次加载屏，之后各页继续走新缓存。
# 内容没变时指纹不变、不提交、不部署 —— 站内切换照旧快速、不闪、不弹。
#
# ⚠️ 和 generate-post-index.yml 一样：自己推上去的版本号提交不能再跑一遍（job 上的 if），
#    提交消息也不要带 [skip ci]（Cloudflare 会跳过部署）。

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: stamp-sw-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    if: "github.actor != 'github-actions[bot]'"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stamp CACHE_VERSION in sw.js
        run: node .github/stamp-sw-version.mjs

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if git diff --cached --quiet; then
            echo "内容没变，CACHE_VERSION 不用动"
            exit 0
          fi
          git commit -m "chore(sw): stamp CACHE_VERSION"
          # 万一这期间有人推了别的提交，先 rebase 再推
          git push || { git pull --rebase --autostash origin master && git push; }
