name: Build File Archive Index

# assets/document/ 与 assets/uncategorized/ 是文件档案 / 未归类档案的唯一来源；
# assets/data/document.js / uncategorized.js 是生成物。
# 改了文件（或 sidecar 元数据）却忘了在本地跑 build 时，这里补上并提交结果：
#   人 push（改两个来源目录）→ 本工作流 build → 提交 assets/data/* + sw.js
#   → Cloudflare 按这次提交部署 → 访客拿到新索引。
#
# ⚠️ 自己推上去的提交不能再跑一遍（job 上的 if）；提交消息也不要带 [skip ci]。
# CACHE_VERSION 也必须在这里手动 stamp 一次：stamp-sw-version.yml 会跳过 bot 提交，
# 不盖的话线上 JS 更新了、老访客还在吃旧缓存。

on:
  push:
    branches: [master]
    paths:
      - 'assets/document/**'
      - 'assets/uncategorized/**'
      - 'src/scripts/document-index.mjs'
      - '.github/workflows/document-index.yml'
  workflow_dispatch:

concurrency:
  group: document-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "github.actor != 'github-actions[bot]'"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build archive indexes from assets/document/ and assets/uncategorized/
        run: node src/scripts/document-index.mjs

      - name: Stamp CACHE_VERSION in sw.js
        run: node .github/stamp-sw-version.mjs

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data sw.js
          if git diff --cached --quiet; then
            echo "生成结果没变化，不用提交"
            exit 0
          fi
          git commit -m "chore(file-archive): rebuild index from assets/document + assets/uncategorized"
          if ! git push; then
            git pull --rebase --autostash origin master
            node src/scripts/document-index.mjs
            node .github/stamp-sw-version.mjs
            git add assets/data sw.js
            if ! git diff --cached --quiet; then
              git commit -m "chore(file-archive): rebuild index from assets/document + assets/uncategorized"
            fi
            git push
          fi
