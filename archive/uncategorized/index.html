<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未归类档案·星光圣域</title>

    <!-- 站点图标：SVG，跟随浏览器主题切换黑/白描边 -->
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo_SSS.svg">

    <!-- 加载屏：只有「资源还没进缓存」时才显示（首次访问 / 缓存被清掉）。
         判断必须在这里同步做 —— 首次绘制前就要决定，否则会先画出页面再盖上、闪一下。
         结构与逻辑见 assets/js/boot.js，样式见 assets/css/boot.css。 -->
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;      // 没有 SW，就没有"缓存全部资源"这回事
            if (location.protocol === 'file:') return;        // 本地双击打开时 SW 注册不了，别把页面卡住
            /* 这一趟要不要显示加载屏。必须同步、首次绘制前决定，否则会先画出页面再盖上、闪一下。 */
            function decide() {
                var force = /(^|[?&])boot(=|&|$)/.test(location.search || '');   // ?boot=1：强制重播（调试用）
                var booted = false;
                try { booted = localStorage.getItem('sss-booted') === '1'; } catch (e) {}

                // ① 这一次不是从 SW 缓存里拿的 → 该弹加载屏。controller 为空意味着：首次访问、
                //    Ctrl+F5 硬刷新（硬刷新会连 Service Worker 一起绕过）、或站点数据被清过。
                //    光看 sss-booted 标记不够 —— 它只记「这台浏览器走过加载流程」，
                //    硬刷新时「标记还在」与「资源确实没走缓存」会分叉。
                var cold = !navigator.serviceWorker.controller;

                // ② 刚部署过新版本：seamless.js 在新 SW 接管（controllerchange）时留下的标记，
                //    说明缓存整个换过一轮，这一趟补弹一次。读走即清，只补一次。
                var afterUpdate = false;
                try {
                    afterUpdate = localStorage.getItem('sss-boot-next') === '1';
                    if (afterUpdate) localStorage.removeItem('sss-boot-next');
                } catch (e) {}

                // ③ 其余情况（站内正常导航）：不弹，切换才不会闪
                if (force || !booted || cold || afterUpdate) {
                    document.documentElement.className += ' sss-boot';
                }
            }

            // 预渲染中的文档是隐藏的：这时候不该判定（controller 状态、标记消费都不该在隐藏期
            // 决定），更不该让加载屏放掉 —— boot.js 会在后台把门开完，用户激活后根本看不到。
            // 所以等真正被激活（首次绘制就在这一刻）再同步判一次，仍然不会闪。
            // 若用户最后点的是别的链接、这份预渲染被丢弃，sss-boot-next 也没被吃掉，下一页照常补弹。
            if (document.prerendering) {
                document.addEventListener('prerenderingchange', decide, { once: true });
            } else {
                decide();
            }

            // 站内跳转进来的（referrer 与本页同源）：先把内容藏起来，等字体就绪再淡入。
            // 背景画布与导航栏全站一致，所以只让内容参与过渡 —— 看起来就是
            // 「外壳常驻、内容替换」，顺带把字体解码那 0.3–0.7 秒的空窗盖住。
            // 必须在这里同步决定（首次绘制前），否则会先把内容画出来再藏、闪一下。
            var fromSite = false;
            try {
                fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (e) {}
            if (fromSite) {
                document.documentElement.classList.add('sss-switch');
                // 兜底：万一 boot.js 没跑起来，5 秒后也得把内容放出来
                window.setTimeout(function () {
                    document.documentElement.classList.remove('sss-switch');
                    document.documentElement.classList.add('sss-switch-in');
                }, 5000);
            }
        })();
    </script>
    <!-- 首帧保护：预渲染被提前激活时（悬停后就点），浏览器可能先画一帧"样式表还在路上"的
         裸 HTML（正常导航不会 —— 样式表本身阻塞渲染）。这里在解析阶段先把内容藏起来，
         等样式表就位（或 2s 兜底）再放行；禁用 JS 时不加 js 类，等于没这段。 -->
    <style>
        /* 底色只能挂在"加载中"这个状态下：html 一旦有背景，body 的黑色就不再传播到画布，
           负 z-index 的背景层（.hex-bg 等）会被 body 盖住 —— 背景就没了。
           所以两条都限定在 js 且未 css-ready 时，样式一到就撤销、传播恢复。 */
        html.js:not(.css-ready) { background: black; }
        html.js:not(.css-ready) body { visibility: hidden; }
    </style>
    <script>
        (function () {
            var h = document.documentElement;
            h.classList.add('js');
            window.setTimeout(function () { h.classList.add('css-ready'); }, 2000);
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/boot.css">
    <script defer src="../../assets/js/boot.js"></script>

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/catalog.css">
    <link rel="stylesheet" href="../../assets/css/archive.css">
    <!-- 各节面板复用组织档案的 .org-block / .org-meta 材质 -->
    <link rel="stylesheet" href="../../assets/css/archive/organization.css">
    <!-- .md 文档正文：与主页面共用同一份 Markdown 视觉 -->
    <link rel="stylesheet" href="../../assets/css/markdown.css">
    <link rel="stylesheet" href="../../assets/css/archive/document.css">
    <script defer src="../../assets/js/background.js"></script>
    <script defer src="../../assets/js/cursor.js"></script>
    <script defer src="../../assets/js/notice.js"></script>
    <script defer src="../../assets/js/seamless.js"></script>
    <script defer src="../../assets/js/spa.js"></script>
    <script defer src="../../assets/js/navtoggle.js"></script>
    <script defer src="../../assets/js/catalog.js"></script>
    <!-- 彩蛋登记册：记录 <body data-egg> 的彩蛋、给「关于」页那张卡片填内容。
         ⚠️ 外壳脚本，站内换页（spa.js）不会重跑它 —— 每页都必须引，否则经由同文档换页
         进「关于」页 / 进彩蛋页时，登记与卡片都不会发生。 -->
    <script defer src="../../assets/js/eggs.js"></script>
    <!-- 滚动淡出：按滚动位置连续控制上下淡出，短内容不压暗 -->
    <script defer src="../../assets/js/archive-scroll.js"></script>
    <!-- 左栏名录搜索：按名称过滤（外观与交互照星图搜索） -->
    <script defer src="../../assets/js/archive-list-search.js"></script>
    <!-- 未归类档案数据库：由 src/scripts/document-index.mjs 扫描 assets/uncategorized/ 生成，别手改 -->
    <script defer src="../../assets/data/uncategorized.js"></script>
    <!-- Markdown 渲染（主页面同款，marked v9.1.6） -->
    <script defer src="../../assets/js/marked.min.js"></script>
    <!-- 未归类档案页：读取数据 → 渲染名录 / 档案 / 详情面板，再接搜索、深链、.md、音轨 -->
    <script defer src="../../assets/js/document.js"></script>
    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
    <!-- 样式表就位后放行（这行内联脚本会被它前面的样式表阻塞，所以执行时样式一定已经应用） -->
    <script>document.documentElement.classList.add('css-ready');</script>
</head>

<body data-archive="split">

        </button>

    </header>

    <main>
        <!-- ══ 未归类档案 ══
             页面本身不写死任何记录：名录 / 档案 / 预览 / 详情都由 assets/js/document.js
             读取 assets/data/uncategorized.js 后渲染。

             文件放 assets/uncategorized/<来源>/<文件名>.<扩展名>，跑：
               node src/scripts/document-index.mjs
             会自动按扩展名归档（.md → 文档、图片 → 图像、音频 / 视频各自一组），
             来源取第一层目录名；标题 / 日期 / 摘要等写在同目录的
             <文件名>.<扩展名>.meta.json 里（可选）。详见 docs/MAINTENANCE.md「未归类档案」。 -->
        <section class="archive-section document-section">

            <nav class="crumb" aria-label="位置">
                <a href="../">档案</a>
                <span class="crumb__sep" aria-hidden="true">/</span>
                <span class="crumb__here">未归类档案</span>
            </nav>

            <header class="archive-head">
                <p class="page-eyebrow">
                    <span class="page-eyebrow__id">ARCHIVE</span>
                </p>
                <h1>未归类档案</h1>
                <p class="archive-sub">Uncategorized Archives</p>
            </header>

            <!-- 标题以下才是滚动区：页头与页脚固定在视口里，内容在中间滚动并在两端淡出。
                 详见 assets/css/archive.css 的「档案页视口框」与 docs/MAINTENANCE.md。 -->
            <div class="archive-body">

            <div class="document-layout" data-archive-base="../../assets/uncategorized/" data-archive-data="SSS_UNCATEGORIZED">

                <!-- ── 左栏：文件名录（由 document.js 填充） ── -->
                <aside class="document-list" aria-label="文件名录">
                    <div class="document-list__head">
                        <p class="document-list__title">名录 <span data-doc-count>0</span></p>
                        <div class="archive-search">
                            <input type="search" class="archive-search__input" placeholder="搜索文件" aria-label="按名称搜索文件" autocomplete="off" spellcheck="false">
                            <p class="archive-search__empty" hidden>没有找到匹配的条目</p>
                        </div>
                    </div>
                    <div class="document-list__scroll" data-doc-list data-catalog data-catalog-kind="list" data-catalog-unit="项" data-catalog-note="本地文件尚未归类归档" data-catalog-slot data-catalog-slot-desc="本地文件尚未归类归档"></div>
                </aside>

                <!-- ── 右栏：选中文件的档案（由 document.js 追加） ── -->
                <div class="document-detail">

                    <!-- 未选中任何条目时的空白态；选中后由 document.js 隐藏 -->
                    <div class="archive-empty" role="status" aria-label="未选择文件">
                        <span class="archive-empty__dot" aria-hidden="true"></span>
                        <p class="archive-empty__text">NO / INFO</p>
                    </div>

                </div>

            </div>

            </div>
        </section>
    </main>
