<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具·星光圣域</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/tool/index.css">
    <script defer src="../assets/js/background.js"></script>
    <script defer src="../assets/js/notice.js"></script>
    <script defer src="../assets/js/seamless.js"></script>
    <script defer src="../assets/js/tool.js"></script>

    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">

        <div class="logo">
            星光圣域
        </div>

        <nav>
            <a href="..">首页</a>
            <a href="../starmap/">星图</a>
            <a href="../fleet/">舰队</a>
            <a href=".">工具</a>
            <a href="../archive/">档案</a>
        </nav>

    </header>
    <main class="tool-layout">

        <!-- 左栏（窄）：需要二级入口的复杂工具 -->
        <aside class="tool-side">
            <h2 class="tool-side__title">阅读与工具</h2>
            <p class="tool-side__hint">点进去是独立的页面</p>

            <p class="tool-side__empty">暂时还没有需要二级入口的工具</p>

            <!-- 以后需要二级入口的工具按这个结构加在这里：
                 <a class="tool-entry" href="xxx.html">
                     <span class="tool-entry__name">名称</span>
                     <span class="tool-entry__desc">一句话说明</span>
                     <span class="tool-entry__arrow" aria-hidden="true">→</span>
                 </a> -->
        </aside>

        <!-- 右栏（宽）：可以直接用的小工具 -->
        <section class="tool-main">
            <h2 class="tool-main__title">小工具</h2>
            <p class="tool-main__hint">不用跳页，就在这里用</p>

            <div class="tool-card">
                <div class="tool-card__head">
                    <h3 class="tool-card__name">拾色器</h3>
                    <p class="tool-card__desc">圆环选色相，环内方块调饱和度与亮度 —— 覆盖所有颜色。也可用键盘：←→ 色相、↑↓ 亮度、Shift+↑↓ 饱和度；点色值即可复制。</p>
                </div>

                <div class="hue">
                    <div class="hue__wheel-wrap">
                        <canvas id="hue-wheel" class="hue__wheel" width="300" height="300"
                                role="slider" tabindex="0" aria-label="拾色器：色相环与外圈内的饱和度亮度方块"
                                aria-valuemin="0" aria-valuemax="359" aria-valuenow="51"
                                aria-valuetext="#FFD700 · 饱和度 100% · 亮度 50%"></canvas>
                    </div>

                    <div class="hue__panel">
                        <div class="hue__swatch" id="hue-swatch" aria-hidden="true"></div>
                        <dl class="hue__values">
                            <div class="hue__row">
                                <dt>HEX</dt>
                                <dd><button type="button" class="hue__copy" id="hue-hex" data-copy="#FFD700">#FFD700</button></dd>
                            </div>
                            <div class="hue__row">
                                <dt>RGB</dt>
                                <dd><button type="button" class="hue__copy" id="hue-rgb" data-copy="rgb(255, 215, 0)">255, 215, 0</button></dd>
                            </div>
                            <div class="hue__row">
                                <dt>HSL</dt>
                                <dd><button type="button" class="hue__copy" id="hue-hsl" data-copy="hsl(51, 100%, 50%)">51°, 100%, 50%</button></dd>
                            </div>
                        </dl>
                        <p class="hue__tip" id="hue-tip">点色值复制</p>
                    </div>
                </div>
            </div>

            <!-- 以后新增的小工具按同样的 .tool-card 结构加在这里 -->
        </section>

    </main>
</body>
