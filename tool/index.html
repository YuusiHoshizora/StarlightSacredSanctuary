    <!-- 站点图标：SVG，跟随浏览器主题切换黑/白描边 -->
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo_SSS.svg">

    <!-- 加载屏：只有「资源还没进缓存」时才显示（首次访问 / 缓存被清掉）。
         判断必须在这里同步做 —— 首次绘制前就要决定，否则会先画出页面再盖上、闪一下。
         结构与逻辑见 assets/js/boot.js，样式见 assets/css/boot.css。 -->
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;      // 没有 SW，就没有"缓存全部资源"这回事
            if (location.protocol === 'file:') return;        // 本地双击打开时 SW 注册不了，别把页面卡住
            /* 这一趟要不要显示加载屏。必须同步、首次绘制前决定，否则会先画出页面再盖上、闪一下。 */
            function decide() {
                var force = /(^|[?&])boot(=|&|$)/.test(location.search || '');   // ?boot=1：强制重播（调试用）
                var booted = false;
                try { booted = localStorage.getItem('sss-booted') === '1'; } catch (e) {}

                // ① 这一次不是从 SW 缓存里拿的 → 该弹加载屏。controller 为空意味着：首次访问、
                //    Ctrl+F5 硬刷新（硬刷新会连 Service Worker 一起绕过）、或站点数据被清过。
                //    光看 sss-booted 标记不够 —— 它只记「这台浏览器走过加载流程」，
                //    硬刷新时「标记还在」与「资源确实没走缓存」会分叉。
                var cold = !navigator.serviceWorker.controller;

                // ② 刚部署过新版本：seamless.js 在新 SW 接管（controllerchange）时留下的标记，
                //    说明缓存整个换过一轮，这一趟补弹一次。读走即清，只补一次。
                var afterUpdate = false;
                try {
                    afterUpdate = localStorage.getItem('sss-boot-next') === '1';
                    if (afterUpdate) localStorage.removeItem('sss-boot-next');
                } catch (e) {}

                // ③ 其余情况（站内正常导航）：不弹，切换才不会闪
                if (force || !booted || cold || afterUpdate) {
                    document.documentElement.className += ' sss-boot';
                }
            }

            // 预渲染中的文档是隐藏的：这时候不该判定（controller 状态、标记消费都不该在隐藏期
            // 决定），更不该让加载屏放掉 —— boot.js 会在后台把门开完，用户激活后根本看不到。
            // 所以等真正被激活（首次绘制就在这一刻）再同步判一次，仍然不会闪。
            // 若用户最后点的是别的链接、这份预渲染被丢弃，sss-boot-next 也没被吃掉，下一页照常补弹。
            if (document.prerendering) {
                document.addEventListener('prerenderingchange', decide, { once: true });
            } else {
                decide();
            }

            // 站内跳转进来的（referrer 与本页同源）：先把内容藏起来，等字体就绪再淡入。
            // 背景画布与导航栏全站一致，所以只让内容参与过渡 —— 看起来就是
            // 「外壳常驻、内容替换」，顺带把字体解码那 0.3–0.7 秒的空窗盖住。
            // 必须在这里同步决定（首次绘制前），否则会先把内容画出来再藏、闪一下。
            var fromSite = false;
            try {
                fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (e) {}
            if (fromSite) {
                document.documentElement.classList.add('sss-switch');
                // 兜底：万一 boot.js 没跑起来，5 秒后也得把内容放出来
                window.setTimeout(function () {
                    document.documentElement.classList.remove('sss-switch');
                    document.documentElement.classList.add('sss-switch-in');
                }, 5000);
            }
        })();
    </script>
    <!-- 首帧保护：预渲染被提前激活时（悬停后就点），浏览器可能先画一帧"样式表还在路上"的
         裸 HTML（正常导航不会 —— 样式表本身阻塞渲染）。这里在解析阶段先把内容藏起来，
         等样式表就位（或 2s 兜底）再放行；禁用 JS 时不加 js 类，等于没这段。 -->
    <style>
        /* 底色只能挂在"加载中"这个状态下：html 一旦有背景，body 的黑色就不再传播到画布，
           负 z-index 的背景层（.hex-bg 等）会被 body 盖住 —— 背景就没了。
           所以两条都限定在 js 且未 css-ready 时，样式一到就撤销、传播恢复。 */
        html.js:not(.css-ready) { background: black; }
        html.js:not(.css-ready) body { visibility: hidden; }
    </style>
    <script>
        (function () {
            var h = document.documentElement;
            h.classList.add('js');
            window.setTimeout(function () { h.classList.add('css-ready'); }, 2000);
        })();
    </script>

         ⚠️ 外壳脚本，站内换页（spa.js）不会重跑它 —— 每页都必须引，否则经由同文档换页
         进「关于」页 / 进彩蛋页时，登记与卡片都不会发生。 -->
    <script defer src="../assets/js/eggs.js"></script>    <script defer src="../assets/js/tool.js"></script>

    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
    <!-- 样式表就位后放行（这行内联脚本会被它前面的样式表阻塞，所以执行时样式一定已经应用） -->
    <script>document.documentElement.classList.add('css-ready');</script>
</head>

    <script>
    /* 工具页左栏的测试入口：
       · 公告测试 —— 按钮：往 document 上发 sss:notice，notice.js 收到就弹公告；
       · 加载测试 —— 普通链接（../?boot=1），不需要脚本；
       · 指针测试 —— 打开下面的弹层，格子按清单生成，悬停即切换当前光标状态。
         格子同时写 cursor 和 --cursor-kind：自绘层和静态 SVG 光标两条路都能验。 */
    (function () {
        var entry = document.getElementById('entry-notice');
        if (!entry) return;

        entry.addEventListener('click', function () {
            document.dispatchEvent(new Event('sss:notice'));
        });
    })();

    (function () {
        var CURSORS = [
            ['default', '默认 · 星芒'],
            ['pointer', '可点 · 链接'],
            ['text', '文本'],
            ['vertical-text', '竖排文本'],
            ['crosshair', '准星 · 取点'],
            ['grab', '可拖拽'],
            ['grabbing', '拖拽中'],
            ['move', '移动'],
            ['all-scroll', '全域滚动'],
            ['cell', '单元格'],
            ['context-menu', '菜单'],
            ['help', '帮助'],
            ['wait', '等待'],
            ['progress', '进行中'],
            ['copy', '复制'],
            ['alias', '捷径'],
            ['zoom-in', '放大'],
            ['zoom-out', '缩小'],
            ['not-allowed', '禁止'],
            ['no-drop', '不可放置'],
            ['ew-resize', '横向缩放'],
            ['ns-resize', '纵向缩放'],
            ['nesw-resize', '对角缩放 ↗'],
            ['nwse-resize', '对角缩放 ↘']
        ];

        var modal = document.getElementById('cursor-test');
        var grid = document.getElementById('cursor-test-grid');
        var entry = document.getElementById('entry-cursor');
        var closeBtn = document.getElementById('cursor-test-close');
        if (!modal || !grid || !entry || !closeBtn) return;

        CURSORS.forEach(function (item) {
            var kind = item[0];
            var cell = document.createElement('div');
            cell.className = 'cursor-test__cell';
            cell.style.cursor = 'var(--cur-' + kind + ')';
            cell.style.setProperty('--cursor-kind', kind);

            var img = document.createElement('img');
            img.className = 'cursor-test__glyph';
            img.src = '/assets/img/cursor/' + kind + '.svg';
            img.alt = '';
            img.width = 40;
            img.height = 40;

            var name = document.createElement('span');
            name.className = 'cursor-test__name';
            name.textContent = item[1];

            var token = document.createElement('span');
            token.className = 'cursor-test__token';
            token.textContent = '--cur-' + kind;

            cell.appendChild(img);
            cell.appendChild(name);
            cell.appendChild(token);
            grid.appendChild(cell);
        });

        var lastFocus = null;

        function open() {
            lastFocus = document.activeElement;
            modal.hidden = false;
            closeBtn.focus();
        }

        function shut() {
            modal.hidden = true;
            if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        entry.addEventListener('click', open);
        closeBtn.addEventListener('click', shut);
        modal.addEventListener('click', function (e) {
            if (e.target === modal) shut();          /* 点遮罩关闭，点面板不关 */
        });
        function onKeydown(e) {
            if (modal.hidden) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                shut();
            } else if (e.key === 'Tab') {
                e.preventDefault();                   /* 弹层里只有关闭按钮可聚焦 */
                closeBtn.focus();
            }
        }
        document.addEventListener('keydown', onKeydown);

        /* SPA 换页时拆掉 document 级监听；浮层本身在 <main> 里，会随内容根一起换掉 */
        if (window.__sssPageCleanup) {
            window.__sssPageCleanup.add('cursor-test', function () {
                document.removeEventListener('keydown', onKeydown);
            });
        }
    })();
    </script>

</body>
</html>
