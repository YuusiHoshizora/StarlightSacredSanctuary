<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具·星光圣域</title>

    <!-- 站点图标：SVG，跟随浏览器主题切换黑/白描边 -->
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo_SSS.svg">

    <!-- 加载屏：只有「资源还没进缓存」时才显示（首次访问 / 缓存被清掉）。
         判断必须在这里同步做 —— 首次绘制前就要决定，否则会先画出页面再盖上、闪一下。
         结构与逻辑见 assets/js/boot.js，样式见 assets/css/boot.css。 -->
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;      // 没有 SW，就没有"缓存全部资源"这回事
            if (location.protocol === 'file:') return;        // 本地双击打开时 SW 注册不了，别把页面卡住
            /* 这一趟要不要显示加载屏。必须同步、首次绘制前决定，否则会先画出页面再盖上、闪一下。 */
            function decide() {
                var force = /(^|[?&])boot(=|&|$)/.test(location.search || '');   // ?boot=1：强制重播（调试用）
                var booted = false;
                try { booted = localStorage.getItem('sss-booted') === '1'; } catch (e) {}

                // ① 这一次不是从 SW 缓存里拿的 → 该弹加载屏。controller 为空意味着：首次访问、
                //    Ctrl+F5 硬刷新（硬刷新会连 Service Worker 一起绕过）、或站点数据被清过。
                //    光看 sss-booted 标记不够 —— 它只记「这台浏览器走过加载流程」，
                //    硬刷新时「标记还在」与「资源确实没走缓存」会分叉。
                var cold = !navigator.serviceWorker.controller;

                // ② 刚部署过新版本：seamless.js 在新 SW 接管（controllerchange）时留下的标记，
                //    说明缓存整个换过一轮，这一趟补弹一次。读走即清，只补一次。
                var afterUpdate = false;
                try {
                    afterUpdate = localStorage.getItem('sss-boot-next') === '1';
                    if (afterUpdate) localStorage.removeItem('sss-boot-next');
                } catch (e) {}

                // ③ 其余情况（站内正常导航）：不弹，切换才不会闪
                if (force || !booted || cold || afterUpdate) {
                    document.documentElement.className += ' sss-boot';
                }
            }

            // 预渲染中的文档是隐藏的：这时候不该判定（controller 状态、标记消费都不该在隐藏期
            // 决定），更不该让加载屏放掉 —— boot.js 会在后台把门开完，用户激活后根本看不到。
            // 所以等真正被激活（首次绘制就在这一刻）再同步判一次，仍然不会闪。
            // 若用户最后点的是别的链接、这份预渲染被丢弃，sss-boot-next 也没被吃掉，下一页照常补弹。
            if (document.prerendering) {
                document.addEventListener('prerenderingchange', decide, { once: true });
            } else {
                decide();
            }

            // 站内跳转进来的（referrer 与本页同源）：先把内容藏起来，等字体就绪再淡入。
            // 背景画布与导航栏全站一致，所以只让内容参与过渡 —— 看起来就是
            // 「外壳常驻、内容替换」，顺带把字体解码那 0.3–0.7 秒的空窗盖住。
            // 必须在这里同步决定（首次绘制前），否则会先把内容画出来再藏、闪一下。
            var fromSite = false;
            try {
                fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (e) {}
            if (fromSite) {
                document.documentElement.classList.add('sss-switch');
                // 兜底：万一 boot.js 没跑起来，5 秒后也得把内容放出来
                window.setTimeout(function () {
                    document.documentElement.classList.remove('sss-switch');
                    document.documentElement.classList.add('sss-switch-in');
                }, 5000);
            }
        })();
    </script>
    <!-- 首帧保护：预渲染被提前激活时（悬停后就点），浏览器可能先画一帧"样式表还在路上"的
         裸 HTML（正常导航不会 —— 样式表本身阻塞渲染）。这里在解析阶段先把内容藏起来，
         等样式表就位（或 2s 兜底）再放行；禁用 JS 时不加 js 类，等于没这段。 -->
    <style>
        /* 底色只能挂在"加载中"这个状态下：html 一旦有背景，body 的黑色就不再传播到画布，
           负 z-index 的背景层（.hex-bg 等）会被 body 盖住 —— 背景就没了。
           所以两条都限定在 js 且未 css-ready 时，样式一到就撤销、传播恢复。 */
        html.js:not(.css-ready) { background: black; }
        html.js:not(.css-ready) body { visibility: hidden; }
    </style>
    <script>
        (function () {
            var h = document.documentElement;
            h.classList.add('js');
            window.setTimeout(function () { h.classList.add('css-ready'); }, 2000);
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/boot.css">
    <script defer src="../assets/js/boot.js"></script>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/tool/index.css">
    <script defer src="../assets/js/background.js"></script>
    <script defer src="../assets/js/notice.js"></script>
    <script defer src="../assets/js/seamless.js"></script>
    <script defer src="../assets/js/navtoggle.js"></script>    <script defer src="../assets/js/tool.js"></script>

    <!-- 预渲染 / 预取：鼠标悬停或按下导航链接时，提前把目标页面准备好（仅 Chromium 内核生效） -->
    <script type="speculationrules">
        {
            "prerender": [
                {
                    "where": {
                        "and": [
                            { "selector_matches": "nav a" },
                            { "not": { "href_matches": "/" } }
                        ]
                    },
                    "eagerness": "moderate"
                }
            ],
            "prefetch": [
                { "where": { "selector_matches": "nav a" }, "eagerness": "conservative" }
            ]
        }
    </script>
    <!-- 样式表就位后放行（这行内联脚本会被它前面的样式表阻塞，所以执行时样式一定已经应用） -->
    <script>document.documentElement.classList.add('css-ready');</script>
</head>

<body>

    <!-- 加载屏的容器：结构与逻辑由 assets/js/boot.js 生成，默认不显示 -->
    <div class="boot" id="boot"></div>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">

        <div class="logo">
            <span class="logo__mark" aria-hidden="true"></span>
            星光圣域
        </div>

        <nav id="site-nav">
            <a href="..">首页</a>
            <a href="../starmap/">星图</a>
            <a href="../fleet/">舰队</a>
            <a href=".">工具</a>
            <a href="../archive/">档案</a>
            <a href="../about/">关于</a>
        </nav>

        <!-- 折叠按钮：窄屏才出现（桌面 display:none），是 .navbar 自己的子元素，
             所以和 logo 一样是栏内的一行；放进 nav 里会被那块竖排面板当成一个条目 -->
        <button class="navbar__toggle" type="button" aria-label="导航菜单" aria-controls="site-nav" aria-expanded="false">
            <span class="navbar__toggle__bars" aria-hidden="true"></span>
        </button>

    </header>
    <main class="tool-layout">

        <!-- 左栏（窄）：需要二级入口的复杂工具 -->
        <aside class="tool-side">
            <h2 class="tool-side__title">测试工具</h2>

            <!-- 测试入口（会随站点一起发布，访客也能看到）：
                 公告测试 → 发一个 sss:notice 事件，让 notice.js 弹一次公告
                 加载测试 → 就是个普通链接，跳到 ../?boot=1 重播一次首屏加载屏 -->
            <a class="tool-entry" href="#" id="entry-notice">
                <span class="tool-entry__name">公告测试</span>
                <span class="tool-entry__desc">重新弹一次站点公告</span>
                <span class="tool-entry__arrow">›</span>
            </a>

            <a class="tool-entry" href="../?boot=1">
                <span class="tool-entry__name">加载测试</span>
                <span class="tool-entry__desc">重播一遍首屏加载流程</span>
                <span class="tool-entry__arrow">›</span>
            </a>
        </aside>

        <!-- 右栏（宽）：可以直接用的小工具 -->
        <section class="tool-main">
            <div class="tool-card">
                <h3 class="tool-card__name">拾色器</h3>

                <div class="hue">
                    <div class="hue__wheel-wrap">
                        <canvas id="hue-wheel" class="hue__wheel" width="220" height="220"
                                role="slider" tabindex="0" aria-label="拾色器：色相环与外圈内的饱和度亮度方块"
                                aria-valuemin="0" aria-valuemax="359" aria-valuenow="249"
                                aria-valuetext="#3A3072 · 饱和度 41% · 亮度 32%"></canvas>
                    </div>

                    <div class="hue__panel">
                        <div class="hue__swatch" id="hue-swatch" aria-hidden="true"></div>
                        <div class="hue__values">
                            <div class="hue__row">
                                <span class="hue__key">HEX</span>
                                <input type="text" id="hue-hex" class="hue__input" value="#3A3072"
                                       spellcheck="false" autocomplete="off"
                                       aria-label="HEX 颜色值，输入后回车跳转" />
                                <button type="button" class="hue__copy" data-target="hue-hex"
                                        aria-label="复制 HEX 值" title="复制">
                                    <svg viewBox="0 0 16 16" aria-hidden="true">
                                        <rect x="5.5" y="5.5" width="8" height="8.5" rx="1.5"/>
                                        <path d="M10.5 5.5V3.6A1.6 1.6 0 0 0 8.9 2H4.1A1.6 1.6 0 0 0 2.5 3.6v7A1.6 1.6 0 0 0 4.1 12h1.4"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="hue__row">
                                <span class="hue__key">RGB</span>
                                <input type="text" id="hue-rgb" class="hue__input" value="58, 48, 114"
                                       spellcheck="false" autocomplete="off"
                                       aria-label="RGB 颜色值，输入后回车跳转" />
                                <button type="button" class="hue__copy" data-target="hue-rgb"
                                        aria-label="复制 RGB 值" title="复制">
                                    <svg viewBox="0 0 16 16" aria-hidden="true">
                                        <rect x="5.5" y="5.5" width="8" height="8.5" rx="1.5"/>
                                        <path d="M10.5 5.5V3.6A1.6 1.6 0 0 0 8.9 2H4.1A1.6 1.6 0 0 0 2.5 3.6v7A1.6 1.6 0 0 0 4.1 12h1.4"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="hue__row">
                                <span class="hue__key">HSL</span>
                                <input type="text" id="hue-hsl" class="hue__input" value="249°, 41%, 32%"
                                       spellcheck="false" autocomplete="off"
                                       aria-label="HSL 颜色值，输入后回车跳转" />
                                <button type="button" class="hue__copy" data-target="hue-hsl"
                                        aria-label="复制 HSL 值" title="复制">
                                    <svg viewBox="0 0 16 16" aria-hidden="true">
                                        <rect x="5.5" y="5.5" width="8" height="8.5" rx="1.5"/>
                                        <path d="M10.5 5.5V3.6A1.6 1.6 0 0 0 8.9 2H4.1A1.6 1.6 0 0 0 2.5 3.6v7A1.6 1.6 0 0 0 4.1 12h1.4"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <p class="hue__tip" id="hue-tip"></p>
                    </div>
                </div>
            </div>

            <!-- 时间转换：星纪元（S.E.） ⇄ 公元（A.D.）。
                 两边都是三个数字框，任何一边改动，另一边即时跟着变。
                 纪元：公元 2110-01-01 00:00:00 UTC = S.E. 1 年 1 月 1 日 00:00:00。
                 公元 2110 年之前的日期落在纪元前，星纪元年份记作 0 或负数（前星纪元）。 -->
            <div class="tool-card tool-card--timeconv">
                <h3 class="tool-card__name">时间转换</h3>

                <div class="timeconv">

                    <!-- 上：星纪元 -->
                    <section class="timeconv__block">
                        <div class="timeconv__head">
                            <span class="timeconv__label">星纪元</span>
                            <span class="timeconv__unit">S.E.</span>
                        </div>

                        <div class="timeconv__fields">
                            <label class="timeconv__field">
                                <input type="number" id="se-year" class="tool-field" inputmode="numeric"
                                       value="395" aria-label="星纪元 年（0 或负数表示前星纪元）" />
                                <span class="timeconv__key">年</span>
                            </label>
                            <label class="timeconv__field">
                                <input type="number" id="se-month" class="tool-field" inputmode="numeric"
                                       value="6" aria-label="星纪元 月（1–12）" />
                                <span class="timeconv__key">月</span>
                            </label>
                            <label class="timeconv__field">
                                <input type="number" id="se-day" class="tool-field" inputmode="numeric"
                                       value="9" aria-label="星纪元 日（1–30）" />
                                <span class="timeconv__key">日</span>
                            </label>
                        </div>

                        <p class="timeconv__note" id="se-note"></p>
                    </section>

                    <!-- 中：换算方向 -->
                    <div class="timeconv__switch" aria-hidden="true">
                        <svg viewBox="0 0 16 16">
                            <path d="M8 2.5v11M4.5 6L8 2.5 11.5 6M4.5 10L8 13.5 11.5 10"/>
                        </svg>
                    </div>

                    <!-- 下：公元 -->
                    <section class="timeconv__block">
                        <div class="timeconv__head">
                            <span class="timeconv__label">公元</span>
                            <span class="timeconv__unit">A.D.</span>
                        </div>

                        <div class="timeconv__fields">
                            <label class="timeconv__field">
                                <input type="number" id="ad-year" class="tool-field" inputmode="numeric"
                                       value="2498" aria-label="公元 年" />
                                <span class="timeconv__key">年</span>
                            </label>
                            <label class="timeconv__field">
                                <input type="number" id="ad-month" class="tool-field" inputmode="numeric"
                                       value="9" aria-label="公元 月（1–12）" />
                                <span class="timeconv__key">月</span>
                            </label>
                            <label class="timeconv__field">
                                <input type="number" id="ad-day" class="tool-field" inputmode="numeric"
                                       value="25" aria-label="公元 日" />
                                <span class="timeconv__key">日</span>
                            </label>
                        </div>

                        <p class="timeconv__note" id="ad-note"></p>
                    </section>

                </div>
            </div>

        </section>

    </main>

    </footer>

    <script>
    /* 工具页左栏两个测试入口的行为（另一个是普通链接，不需要脚本）：
       「公告测试」发一个 document 上的 sss:notice 事件，notice.js 收到就弹公告。 */
    (function () {
        var entry = document.getElementById('entry-notice');
        if (!entry) return;

        entry.addEventListener('click', function (e) {
            e.preventDefault();                 // 是个 <a href="#">，别让它跳走
            document.dispatchEvent(new Event('sss:notice'));
        });
    })();
    </script>

</body>
</html>
