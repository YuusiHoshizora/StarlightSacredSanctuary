<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星图·星光圣域</title>

    <!-- 站点图标：SVG，跟随浏览器主题切换黑/白描边 -->
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo_SSS.svg">

    <!-- 加载屏：只有「资源还没进缓存」时才显示（首次访问 / 缓存被清掉）。
         判断必须在这里同步做 —— 首次绘制前就要决定，否则会先画出页面再盖上、闪一下。
         结构与逻辑见 assets/js/boot.js，样式见 assets/css/boot.css。 -->
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) return;      // 没有 SW，就没有"缓存全部资源"这回事
            if (location.protocol === 'file:') return;        // 本地双击打开时 SW 注册不了，别把页面卡住
            /* 这一趟要不要显示加载屏。必须同步、首次绘制前决定，否则会先画出页面再盖上、闪一下。 */
            function decide() {
                var force = /(^|[?&])boot(=|&|$)/.test(location.search || '');   // ?boot=1：强制重播（调试用）
                var booted = false;
                try { booted = localStorage.getItem('sss-booted') === '1'; } catch (e) {}

                // ① 这一次不是从 SW 缓存里拿的 → 该弹加载屏。controller 为空意味着：首次访问、
                //    Ctrl+F5 硬刷新（硬刷新会连 Service Worker 一起绕过）、或站点数据被清过。
                //    光看 sss-booted 标记不够 —— 它只记「这台浏览器走过加载流程」，
                //    硬刷新时「标记还在」与「资源确实没走缓存」会分叉。
                var cold = !navigator.serviceWorker.controller;

                // ② 刚部署过新版本：seamless.js 在新 SW 接管（controllerchange）时留下的标记，
                //    说明缓存整个换过一轮，这一趟补弹一次。读走即清，只补一次。
                var afterUpdate = false;
                try {
                    afterUpdate = localStorage.getItem('sss-boot-next') === '1';
                    if (afterUpdate) localStorage.removeItem('sss-boot-next');
                } catch (e) {}

                // ③ 其余情况（站内正常导航）：不弹，切换才不会闪
                if (force || !booted || cold || afterUpdate) {
                    document.documentElement.className += ' sss-boot';
                }
            }

            // 预渲染中的文档是隐藏的：这时候不该判定（controller 状态、标记消费都不该在隐藏期
            // 决定），更不该让加载屏放掉 —— boot.js 会在后台把门开完，用户激活后根本看不到。
            // 所以等真正被激活（首次绘制就在这一刻）再同步判一次，仍然不会闪。
            // 若用户最后点的是别的链接、这份预渲染被丢弃，sss-boot-next 也没被吃掉，下一页照常补弹。
            if (document.prerendering) {
                document.addEventListener('prerenderingchange', decide, { once: true });
            } else {
                decide();
            }

            // 站内跳转进来的（referrer 与本页同源）：先把内容藏起来，等字体就绪再淡入。
            // 背景画布与导航栏全站一致，所以只让内容参与过渡 —— 看起来就是
            // 「外壳常驻、内容替换」，顺带把字体解码那 0.3–0.7 秒的空窗盖住。
            // 必须在这里同步决定（首次绘制前），否则会先把内容画出来再藏、闪一下。
            var fromSite = false;
            try {
                fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
            } catch (e) {}
            if (fromSite) {
                document.documentElement.classList.add('sss-switch');
                // 兜底：万一 boot.js 没跑起来，5 秒后也得把内容放出来
                window.setTimeout(function () {
                    document.documentElement.classList.remove('sss-switch');
                    document.documentElement.classList.add('sss-switch-in');
                }, 5000);
            }
        })();
    </script>
    <!-- 首帧保护：预渲染被提前激活时（悬停后就点），浏览器可能先画一帧"样式表还在路上"的
         裸 HTML（正常导航不会 —— 样式表本身阻塞渲染）。这里在解析阶段先把内容藏起来，
         等样式表就位（或 2s 兜底）再放行；禁用 JS 时不加 js 类，等于没这段。 -->
    <style>
        /* 底色只能挂在"加载中"这个状态下：html 一旦有背景，body 的黑色就不再传播到画布，
           负 z-index 的背景层（.hex-bg 等）会被 body 盖住 —— 背景就没了。
           所以两条都限定在 js 且未 css-ready 时，样式一到就撤销、传播恢复。 */
        html.js:not(.css-ready) { background: black; }
        html.js:not(.css-ready) body { visibility: hidden; }
    </style>
    <script>
        (function () {
            var h = document.documentElement;
            h.classList.add('js');
            h.classList.add('starmap-loading');
            window.setTimeout(function () { h.classList.add('css-ready'); }, 2000);
        })();
    </script>
    <link rel="stylesheet" href="../../assets/css/boot.css">
    <script defer src="../../assets/js/boot.js"></script>

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/starmap/index.css">
    <!-- 星图页专用背景参数：必须排在 background.js 之前 -->
    <script defer src="../../assets/js/starmap-bg.js"></script>
    <script defer src="../../assets/js/background.js"></script>
    <script defer src="../../assets/js/notice.js"></script>

    <script defer src="../../assets/data/starmap-data.js"></script>
    <script defer src="../../assets/js/starmap.js"></script>
    <script defer src="../../assets/js/seamless.js"></script>
    <!-- 样式表就位后放行（这行内联脚本会被它前面的样式表阻塞，所以执行时样式一定已经应用） -->
    <script>document.documentElement.classList.add('css-ready');</script>
</head>

<body class="starmap-os-page">

    <!-- 加载屏的容器：结构与逻辑由 assets/js/boot.js 生成，默认不显示 -->
    <div class="boot" id="boot"></div>

    <!-- Starmap®OS 启动画面：进页面自动跑，加载完淡出，把画面交给星图坐标背景 -->
    <div class="starmap-os" id="starmap-os" role="status" aria-live="polite">
        <div class="starmap-os__frame" aria-hidden="true"></div>
        <div class="starmap-os__inner">
            <div class="starmap-os__head">
                <span class="starmap-os__mark" aria-hidden="true"></span>
                <div class="starmap-os__names">
                    <p class="starmap-os__name">Starmap<sup>®</sup>OS</p>
                    <p class="starmap-os__dept">Version Archive Dept.</p>
                </div>
            </div>
            <div class="starmap-os__rule" aria-hidden="true">
                <span>Ver.9.2.1</span>
                <span class="starmap-os__dots"><i></i><i></i><i></i></span>
                <span>LOADING</span>
            </div>
            <div class="starmap-os__readout">
                <p class="starmap-os__line" data-line>正在校验星域索引…</p>
                <div class="starmap-os__bar" aria-hidden="true"><i></i></div>
            </div>
        </div>
    </div>

    <div class="background"></div>
    <div class="overlay"></div>
    <a class="os-exit" href="../"><span>EXIT</span>退出</a>
<main>

        <div class="starmap-layout">

            <!-- 左侧：星图 -->
            <div class="starmap-left">
                <div class="map-readout" aria-hidden="true">
                    <span class="map-readout__os">STARMAP®OS</span>
                    <span class="map-readout__mode" data-readout-mode><i></i><span data-readout-text>Connecting...</span></span>
                </div>

                <canvas id="starmap-canvas"></canvas>

                <!-- 比例尺控制：缩小 / 滑块（辅助缩放，不显示数值）/ 放大 / 回到默认
                     滑块夹在两个按钮之间，拖动方向与紧邻的按钮一致：
                     向左 = 缩小（同左侧「−」），向右 = 放大（同右侧「+」）。 -->
                <div class="map-zoom" role="group" aria-label="比例尺控制">
                    <button type="button" id="zoom-out" class="map-zoom__btn" aria-label="缩小" title="缩小">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
                    </button>
                    <input type="range" id="zoom-slider" class="map-zoom__slider"
                           min="0" max="1" step="0.01" value="0"
                           aria-label="比例尺（左右拖动缩放）" />
                    <button type="button" id="zoom-in" class="map-zoom__btn" aria-label="放大" title="放大">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button type="button" id="zoom-reset" class="map-zoom__btn" aria-label="回到默认" title="回到默认">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="7.5"/>
                            <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
                        </svg>
                    </button>

                    <!-- 搜索星系（中文名 / 英文名）：结果浮在输入框上方，↑↓ 选择、Enter 跳转、Esc 清空 -->
                    <div class="map-search">
                        <div class="map-search__list" id="galaxy-search-list" role="listbox"
                             aria-label="搜索结果" hidden></div>
                        <input type="search" id="galaxy-search" class="map-search__input"
                               placeholder="搜索星系" autocomplete="off" spellcheck="false"
                               aria-label="按名称搜索星系（中文名或英文名）" />
                    </div>
                </div>
            </div>

            <!-- 右侧：星系介绍 -->
            <!-- 右侧：星系介绍（整块一起滑入 / 收起，箭头挂在面板外面） -->
            <div class="starmap-panel-wrap">
                <aside class="starmap-right">

                    <div id="system-info"></div>
                    <div id="system-list" class="system-list"></div>

                </aside>

                <button class="starmap-panel-toggle" id="starmap-panel-toggle" type="button"
                        aria-controls="system-info" aria-expanded="true" aria-label="收起信息栏">
                    <span class="starmap-panel-toggle__arrow" aria-hidden="true"></span>
                </button>
            </div>

        </div>

    </main>

    <!-- 星图页刻意不放页脚：整屏地图要沉浸感。授权声明见其它页面与「关于」页。 -->

    <script>
    /* 星图载入序列：Starmap®OS 启动画面 → 启动画面淡出 / 六边形背景淡出 / 坐标背景淡入
       → 操作按钮与右侧说明栏出现。整页只有这一处时序控制。 */
    (function () {
        var root = document.documentElement;
        var os = document.getElementById('starmap-os');
        if (!os) {
            root.classList.add('starmap-enter', 'starmap-ui');
            root.classList.remove('starmap-loading');
            return;
        }

        var line = os.querySelector('[data-line]');
        var steps = ['正在校验本地存档…', '载入星域快照…', '校准坐标系…', '渲染完成'];
        var step = 0;
        var startedAt = Date.now();
        var timer = window.setInterval(function () {
            if (step < steps.length - 1) {
                step++;
                if (line) line.textContent = steps[step];
            }
        }, 380);

        function reveal() {
            /* 至少让人看清这一屏，不要一闪而过；状态行留到最后一步再跳 */
            var wait = Math.max(0, 1100 - (Date.now() - startedAt));
            window.setTimeout(function () {
                window.clearInterval(timer);
                if (line) line.textContent = steps[steps.length - 1];
                root.classList.add('starmap-enter');      // 启动画面 + 六边形一起淡出，坐标背景淡入
                /* 保险：万一 sss-boot 还挂在 html 上，main 会保持 scale(0.992) + opacity(0.5)，
                   整页会发虚；揭幕时确保它已经移除 */
                root.classList.remove('sss-boot');
                /* 读数：进入 5 秒后从 Connecting... 切到 Offline Mode */
                window.setTimeout(function () {
                    var mode = document.querySelector('[data-readout-mode]');
                    var text = document.querySelector('[data-readout-text]');
                    if (mode) mode.classList.add('is-offline');
                    if (text) text.textContent = 'Offline Mode';
                }, 5000);
                window.setTimeout(function () {
                    root.classList.add('starmap-ui');     // 操作按钮 / 右侧说明栏
                    root.classList.remove('starmap-loading');
                }, 900);
                window.setTimeout(function () {
                    if (os.parentNode) os.parentNode.removeChild(os);
                }, 1000);
            }, wait);
        }

        function begin() {
            /* 等星图脚本把第一帧画出来再揭幕 */
            window.requestAnimationFrame(function () {
                window.requestAnimationFrame(reveal);
            });
        }

        if (root.classList.contains('sss-boot')) {
            /* 首屏加载屏还盖着：等它让开再开始计时，别让这屏在门后面白白播完 */
            document.addEventListener('sss:booted', function () {
                startedAt = Date.now();
                begin();
            }, { once: true });
        } else if (document.readyState === 'complete') {
            begin();
        } else {
            window.addEventListener('load', begin, { once: true });
        }
    })();
    </script>

    <script>
    /* 信息栏展开 / 收起：左边界按钮切换 */
    (function () {
        var toggle = document.getElementById('starmap-panel-toggle');
        var layout = document.querySelector('.starmap-layout');
        if (!toggle || !layout) return;
        toggle.addEventListener('click', function () {
            var collapsed = layout.classList.toggle('is-panel-collapsed');
            toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            toggle.setAttribute('aria-label', collapsed ? '展开信息栏' : '收起信息栏');
        });
    })();
    </script>

</body>
</html>
