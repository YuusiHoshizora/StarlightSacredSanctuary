<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>星图编辑器 · 星光圣域</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/tool/starmap-editor.css">
    <script defer src="../assets/js/seamless.js"></script>
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <header class="navbar">
        <div class="logo">星光圣域</div>
        <nav>
            <a href="..">首页</a>
            <a href="../starmap/">星图</a>
            <a href="../fleet/">舰队</a>
            <a href="./">工具</a>
            <a href="../archive/">档案</a>
        </nav>
    </header>

    <main class="se-app">

        <!-- ===== 工具栏 ===== -->
        <div class="se-toolbar">
            <div class="se-tools">
                <button type="button" id="btn-load-site" class="se-btn">读取站点数据</button>
                <button type="button" id="btn-open" class="se-btn">打开本地文件</button>
                <button type="button" id="btn-save" class="se-btn se-btn--primary">保存到文件</button>
                <button type="button" id="btn-download" class="se-btn">下载 .js</button>
                <button type="button" id="btn-copy" class="se-btn">复制全文</button>
                <span class="se-sep"></span>
                <button type="button" id="btn-add" class="se-btn">新增星系</button>
                <button type="button" id="btn-dup" class="se-btn">复制所选</button>
                <button type="button" id="btn-del" class="se-btn se-btn--danger">删除所选</button>
                <span class="se-sep"></span>
                <button type="button" id="btn-up" class="se-btn" title="在列表中上移">↑</button>
                <button type="button" id="btn-down" class="se-btn" title="在列表中下移">↓</button>
                <button type="button" id="btn-fit" class="se-btn">适应视野</button>
                <button type="button" id="btn-undo" class="se-btn">撤销</button>
            </div>
            <div class="se-meta">
                <span id="dirty" class="se-dirty">与文件一致</span>
                <span class="se-tip">目标文件：assets/js/starmap-data.js</span>
            </div>
        </div>

        <!-- ===== 三栏 ===== -->
        <div class="se-body">

            <!-- 左：星系列表 -->
            <aside class="se-pane se-pane--list">
                <div class="se-pane-title">星系 <span id="count" class="se-count">0</span></div>
                <div id="list" class="se-list"></div>
                <div class="se-help">
                    <p>单击列表或地图上的圆点选中；在地图上<b>拖动圆点</b>改坐标（自动吸附到小格）。</p>
                    <p>滚轮缩放、拖动空白平移、<b>双击空白</b>在该格点新增星系。</p>
                    <p>坐标单位是小格，原点 (0,0) = 维斯佩拉；中坐标 5 小格、大坐标 25 小格。</p>
                    <p>保存：Chrome / Edge 可直接写回文件（Ctrl+S）；其它内核用「下载 .js」覆盖 <code>assets/js/starmap-data.js</code>。</p>
                </div>
            </aside>

            <!-- 中：坐标纸预览 -->
            <section class="se-pane se-pane--map">
                <canvas id="map"></canvas>
                <div class="se-map-hint">滚轮缩放 · 拖动空白平移 · 拖动圆点改坐标 · 双击空白新增</div>
            </section>

            <!-- 右：表单与校验 -->
            <aside class="se-pane se-pane--form">
                <div id="form-empty" class="se-empty">从左侧选一个星系开始编辑</div>

                <form id="form" class="se-form hidden" onsubmit="return false">
                    <label class="se-field">
                        <span>id（英文标识，需唯一）</span>
                        <input type="text" data-field="id" autocomplete="off" spellcheck="false">
                    </label>
                    <label class="se-field">
                        <span>中文名</span>
                        <input type="text" data-field="name" autocomplete="off">
                    </label>
                    <label class="se-field">
                        <span>英文名</span>
                        <input type="text" data-field="nameEn" autocomplete="off" spellcheck="false">
                    </label>
                    <div class="se-field-row">
                        <label class="se-field">
                            <span>恒星数量</span>
                            <input type="text" data-field="starCount" autocomplete="off">
                        </label>
                        <label class="se-field">
                            <span>行星数量</span>
                            <input type="text" data-field="planets" autocomplete="off">
                        </label>
                    </div>
                    <label class="se-field">
                        <span>恒星类型</span>
                        <input type="text" data-field="starType" autocomplete="off">
                    </label>
                    <label class="se-field">
                        <span>开发程度</span>
                        <input type="text" data-field="developmentLevel" autocomplete="off">
                    </label>
                    <label class="se-field">
                        <span>描述</span>
                        <textarea data-field="description" rows="7"></textarea>
                    </label>
                    <div class="se-field-row">
                        <label class="se-field">
                            <span>坐标 x（小格）</span>
                            <input type="text" data-field="x" autocomplete="off" inputmode="numeric">
                        </label>
                        <label class="se-field">
                            <span>坐标 y（小格）</span>
                            <input type="text" data-field="y" autocomplete="off" inputmode="numeric">
                        </label>
                    </div>
                </form>

                <div class="se-pane-title se-pane-title--sub">校验</div>
                <ul id="status" class="se-status"></ul>
            </aside>
        </div>
    </main>

    <input type="file" id="file-input" accept=".js,text/javascript" hidden>
    <div id="toast" class="se-toast"></div>

    <script src="../assets/js/starmap-editor.js"></script>
</body>
</html>
